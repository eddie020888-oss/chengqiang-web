<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="城墙之战">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <title>城墙之战</title>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; background:#1F1F20; overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; }
      #unity-canvas { position:fixed; left:0; top:0; width:100%; height:100%; background:#1F1F20; display:block; }
      #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e8d9b0; font:16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#1F1F20; z-index:10; }
      #loading h1 { font-size:34px; margin:0 0 18px; letter-spacing:6px; }
      #bar { width:70%; max-width:360px; height:10px; background:#3a3a3a; border-radius:5px; overflow:hidden; }
      #fill { height:100%; width:0; background:linear-gradient(90deg,#c9a24a,#f0d070); transition:width .2s; }
      #pct { margin-top:10px; font-size:14px; color:#bbb; }
      #tip { position:absolute; bottom:24px; font-size:12px; color:#777; padding:0 24px; text-align:center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>城墙之战</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="pct">加载中 0%</div>
      <div id="tip">首次加载约 70MB，建议 Wi‑Fi。横屏体验更佳。Safari 可“分享 → 添加到主屏幕”。</div>
    </div>
    <script src="Build/Web.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill"), pct = document.querySelector("#pct");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var dpr = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 2);
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb?v=10272113",
        frameworkUrl: "Build/Web.framework.js.unityweb?v=10272113",
        codeUrl: "Build/Web.wasm.unityweb?v=10272113",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Facai",
        productName: "城墙之战",
        productVersion: "0.1.0",
        devicePixelRatio: dpr,
      }, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
        pct.textContent = p < 0.9 ? "加载中 " + Math.round(p * 100) + "%" : "正在启动…";
      }).then(function (inst) {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (m) {
        pct.textContent = "加载失败：" + m;
      });
    </script>
  </body>
</html>
